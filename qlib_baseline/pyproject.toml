[project]
name = "qlib-baseline"
version = "0.1.0"
description = "Traditional qlib/LightGBM baseline for the ICAIF 2026 LLM trading experiments"
# pyqlib 0.9.7 publishes wheels for cp38-cp312 only, so this sub-project runs on
# Python 3.12 and is kept isolated from the main project (Python 3.13).
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "lightgbm>=4.5",
    # qlib.init() imports mlflow 1.x, which needs protobuf<5 and pkg_resources.
    "protobuf>=4.25,<5",
    "setuptools<81",
    # Same mlflow as fin-difusion; mlflow 3.x refuses the ./mlruns file store qlib uses.
    "mlflow>=1.27,<2",
    # qlib 0.9.7 predates the numpy 2 / pandas 3 API removals.
    "numpy>=1.26,<2",
    "pandas>=2.0,<3",
    "scipy<1.16",
    "tabulate",
    "matplotlib",
    "ipykernel",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "nbconvert",
    "pytest",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
