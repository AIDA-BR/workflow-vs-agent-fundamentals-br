[project]
name = "news-signal"
version = "0.1.0"
description = "Notícias como sinal para o modelo qlib (coleta, textos, features e estudo de evento)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "googlenewsdecoder>=0.1.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
